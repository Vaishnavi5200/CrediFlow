[project]
name = "crediflow"
version = "0.1.0"
description = "CrediFlow — AI-Driven Vendor GST Compliance Nudge System"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rocketride>=0.1.0",
    "reportlab>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[tool.vercel]
entrypoint = "backend.app.main:app"

